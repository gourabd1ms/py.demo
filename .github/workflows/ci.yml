name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: pytest
      - name: Ensure SonarQube Cloud project exists
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          http_code=$(curl -s -o /tmp/sonar_create.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $SONAR_TOKEN" \
            "https://sonarqube.us/api/projects/create" \
            --data-urlencode "organization=gourabd1ms" \
            --data-urlencode "project=gourabd1ms_py_demo" \
            --data-urlencode "name=py.demo")
          echo "HTTP $http_code"
          cat /tmp/sonar_create.json
          if [ "$http_code" != "200" ] && [ "$http_code" != "201" ]; then
            if grep -qi "already exist" /tmp/sonar_create.json; then
              echo "Project already exists, continuing"
            else
              echo "Failed to create Sonar project"
              exit 1
            fi
          fi
      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarqube.us
